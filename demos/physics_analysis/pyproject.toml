[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdyn-physics-demo"
version = "0.1.0"
description = "Isolated FMU truth capture, Rumoca viewer bridge and quadrotor analysis"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "tomli-w>=1.0,<2", "pymavlink>=2.4,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
video = ["playwright>=1.48,<2"]

[project.scripts]
physics-demo = "physics_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
